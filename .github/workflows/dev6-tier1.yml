name: Dev6 Tier-1 isolated benchmark

# Proper Tier-1 lane for v0.1.0-dev6, replacing the retired push-triggered
# dev6-lane.yml (which committed result pushes from the benchmark script).
#
# Two equally explicit manual dispatch mechanisms, because GitHub requires a
# workflow_dispatch workflow to be registered on the DEFAULT branch before it
# can be dispatched, and this mission must not modify main:
#   (a) workflow_dispatch inputs (works once registered), and
#   (b) a deliberate commit to benchmarks/exp-runs/tier1-dispatch.json, which
#       is the push-triggered mechanism already proven to work on this branch.
# Both go through the SAME prepare job and the SAME frozen plan.
#
#  * Every matrix job runs on its own GitHub-hosted ubuntu-latest VM.
#  * Benchmarks NEVER push. All evidence is uploaded as GitHub Actions
#    artifacts with SHA-256 manifests.
#  * mode=export deliberately downloads artifacts from a completed run using
#    the supported actions/download-artifact (run-id) interface and makes ONE
#    explicit evidence commit, so evidence is retrievable via git and the
#    GitHub Contents API (contingency for the blocked blob CDN).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'benchmark | export'
        required: true
        default: 'benchmark'
        type: choice
        options: [benchmark, export]
      experiment_id:
        description: 'Preregistered experiment id (e.g. exp0037)'
        required: true
        type: string
      source_sha:
        description: 'EXACT source commit SHA, or HEAD for the triggering commit'
        required: true
        type: string
      plan_path:
        description: 'Repo-relative path to the frozen JSON job plan'
        required: false
        default: 'benchmarks/exp-runs/tier1-plan.json'
        type: string
      source_run_id:
        description: 'For mode=export: run id whose artifacts are exported'
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'benchmarks/exp-runs/tier1-dispatch.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: dev6-tier1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve dispatch / verify pinned plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      experiment_id: ${{ steps.cfg.outputs.experiment_id }}
      source_sha: ${{ steps.cfg.outputs.source_sha }}
      plan_path: ${{ steps.cfg.outputs.plan_path }}
      source_run_id: ${{ steps.cfg.outputs.source_run_id }}
      jobs: ${{ steps.cfg.outputs.jobs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE='${{ inputs.mode }}'
            EXP='${{ inputs.experiment_id }}'
            SHA='${{ inputs.source_sha }}'
            PLAN='${{ inputs.plan_path }}'
            SRID='${{ inputs.source_run_id }}'
          else
            python3 -c 'import json;d=json.load(open("benchmarks/exp-runs/tier1-dispatch.json"));[print(k+"="+str(d.get(k,""))) for k in ("mode","experiment_id","source_sha","plan_path","source_run_id")]' > /tmp/cfg.env
            cat /tmp/cfg.env
            . /tmp/cfg.env
            MODE="$mode"; EXP="$experiment_id"; SHA="$source_sha"
            PLAN="$plan_path"; SRID="$source_run_id"
          fi
          if [ -z "$SHA" ] || [ "$SHA" = "HEAD" ]; then SHA="$(git rev-parse HEAD)"; fi
          git cat-file -e "$SHA^{commit}" || { echo "unknown source_sha $SHA" >&2; exit 1; }
          echo "event=${{ github.event_name }} mode=$MODE experiment=$EXP source_sha=$SHA plan=$PLAN source_run_id=$SRID"
          git show "$SHA:$PLAN" > /tmp/plan.json
          sha256sum /tmp/plan.json
          python3 -c 'import json;d=json.load(open("/tmp/plan.json"));assert isinstance(d["jobs"],list) and d["jobs"];print("frozen plan jobs:",len(d["jobs"]));[print(" -",j["id"]) for j in d["jobs"]]'
          {
            echo "mode=$MODE"
            echo "experiment_id=$EXP"
            echo "source_sha=$SHA"
            echo "plan_path=$PLAN"
            echo "source_run_id=$SRID"
            echo "jobs=$(python3 -c 'import json;print(json.dumps(json.load(open("/tmp/plan.json"))["jobs"]))')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.cfg.outputs.mode == 'benchmark'
        with:
          python-version: '3.12'
      - name: Install cost-gate build tools
        if: steps.cfg.outputs.mode == 'benchmark'
        run: python3 -m pip install --disable-pip-version-check -q 'cmake' 'ninja'
      - name: Prospective cost gate (fail-closed before any game)
        if: steps.cfg.outputs.mode == 'benchmark'
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ steps.cfg.outputs.source_sha }}'
          EXP='${{ steps.cfg.outputs.experiment_id }}'
          PLAN='${{ steps.cfg.outputs.plan_path }}'
          git show "$SHA:$PLAN" > /tmp/plan-cost.json
          if python3 -c 'import json,sys;sys.exit(0 if "cost_gate" in json.load(open("/tmp/plan-cost.json")) else 1)'; then
            git checkout --detach "$SHA"
            python3 scripts/dev6_cost_gate.py --plan /tmp/plan-cost.json --source-sha "$SHA" --experiment-id "$EXP" --out "benchmarks/recovery/cost-gate-$EXP"
          else
            echo "plan has no cost_gate; legacy plan proceeds without this new gate"
          fi
      - name: Upload cost-gate evidence
        if: always() && steps.cfg.outputs.mode == 'benchmark'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cost-gate-${{ steps.cfg.outputs.experiment_id }}-run${{ github.run_id }}
          path: benchmarks/recovery/cost-gate-${{ steps.cfg.outputs.experiment_id }}/
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 6

  benchmark:
    name: ${{ matrix.job.id }}
    if: needs.prepare.outputs.mode == 'benchmark'
    needs: prepare
    timeout-minutes: 420
    runs-on: ubuntu-latest        # one dedicated GitHub-hosted VM per job
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        job: ${{ fromJSON(needs.prepare.outputs.jobs) }}
    env:
      JOB_JSON: ${{ toJSON(matrix.job) }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      EXPERIMENT_ID: ${{ needs.prepare.outputs.experiment_id }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned benchmark dependencies
        run: python3 -m pip install --disable-pip-version-check -q 'numpy' 'chess==1.11.2' 'cmake' 'ninja'
      - name: Run isolated Tier-1 benchmark job
        run: python3 scripts/dev6_tier1_job.py --job "$JOB_JSON" --source-sha "$SOURCE_SHA" --experiment-id "$EXPERIMENT_ID" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tier1-${{ needs.prepare.outputs.experiment_id }}-${{ matrix.job.id }}-run${{ github.run_id }}
          path: benchmarks/exp-runs/tier1-${{ needs.prepare.outputs.experiment_id }}-${{ matrix.job.id }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  export:
    name: Export evidence (deliberate, explicit)
    if: needs.prepare.outputs.mode == 'export'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
      EXPERIMENT_ID: ${{ needs.prepare.outputs.experiment_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - name: Download artifacts from the pinned run (supported interface)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify checksums and build export manifest
        shell: bash
        run: |
          set -euo pipefail
          find downloaded -type f | sort | head -60
          fails=0
          while IFS= read -r f; do
            ( cd "$(dirname "$f")" && sha256sum -c "$(basename "$f")" ) || fails=$((fails+1))
          done < <(find downloaded -name SHA256SUMS.txt -type f)
          echo "checksum failures: $fails"
          [ "$fails" -eq 0 ] || { echo "artifact checksum mismatch" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > artifacts.json
          python3 -c 'import json,os,datetime;a=json.load(open("artifacts.json"))["artifacts"];m={"exported_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"source_run_id":os.environ["SOURCE_RUN_ID"],"experiment_id":os.environ["EXPERIMENT_ID"],"export_workflow_run_id":os.environ["GITHUB_RUN_ID"],"artifacts":[{"id":x["id"],"name":x["name"],"size_in_bytes":x["size_in_bytes"]} for x in a],"channel":"git + GitHub Contents API (blob CDN unreachable from sandbox)"};json.dump(m,open("export_manifest.json","w"),indent=2);print(json.dumps(m,indent=2))'
      - name: Commit ONE deliberate evidence export
        shell: bash
        run: |
          set -euo pipefail
          dest="benchmarks/exp-runs/tier1-export/run-$SOURCE_RUN_ID"
          mkdir -p "$dest"
          cp -a downloaded/. "$dest"/
          cp export_manifest.json artifacts.json "$dest"/
          git config user.email "dev6-tier1@stockbear.local"
          git config user.name "dev6-tier1-exporter"
          # .gitignore excludes *.log; force-add so raw logs are preserved in
          # the git mirror as well as in the Actions artifact.
          git add -A "$dest"
          git add -f $(find "$dest" -name '*.log' -type f)
          git commit -q -m "dev6-tier1[$EXPERIMENT_ID]: export evidence from run $SOURCE_RUN_ID [skip ci]"
          # GitHub occasionally rejects a push with a transient HTTP 500
          # "Internal Server Error" (observed on direct pushes in this session
          # and on export attempt 18, run 41815187170, whose download and
          # checksum steps both succeeded). A bounded retry makes the evidence
          # mirror robust; a persistent failure still fails the job loudly.
          ok=0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"${{ github.ref_name }}"; then ok=1; break; fi
            echo "export push attempt $attempt failed; retrying" >&2
            sleep 15
          done
          [ "$ok" -eq 1 ] || { echo "export push failed after 4 attempts" >&2; exit 1; }
          echo "exported to $dest at $(git rev-parse HEAD)"
