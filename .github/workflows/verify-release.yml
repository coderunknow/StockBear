name: Verify published prerelease assets

# One-shot audit of the published release, run inside Actions because the
# automation sandbox cannot reach GitHub's asset CDN. It downloads the release
# assets, checks them against the uploaded SHA256SUMS.txt, exercises the Linux
# binary from the archive, and posts the evidence to the pull request.

on:
  push:
    branches: [arena/21f80a33-stockbear]
    paths: ['.github/verify-release', '.github/verify-signature']

permissions:
  contents: read

jobs:
  verify-windows-artifact:
    runs-on: windows-2022
    permissions:
      contents: read    # Download the published assets.
      pull-requests: write # Post the evidence to the pull request.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-dev3
    steps:
      - name: Run the packaged Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir assets
          Expand-Archive assets/stockbear-0.1.0-dev3-windows-x64.zip -DestinationPath x
          Get-ChildItem x | Select-Object Name, Length
          $out = @()
          $out += '### Published Windows asset verification for `v0.1.0-dev3`'
          $out += ''
          $out += '```'
          $out += '$ .\x\stockbear.exe uci | first 12 lines'
          $out += (("uci`nquit`n" | .\x\stockbear.exe) | Select-Object -First 12)
          $out += ''
          $out += '$ .\x\stockbear.exe bench --depth 6 | tail -1'
          $out += (.\x\stockbear.exe bench --depth 6 | Select-Object -Last 1)
          $out += ''
          $out += '$ .\x\stockbear.exe bench --depth 7 | tail -1'
          $out += (.\x\stockbear.exe bench --depth 7 | Select-Object -Last 1)
          $out += '```'
          $out | Set-Content -Encoding utf8 evidence-windows.md
          Get-Content evidence-windows.md
      - name: Post the evidence
        shell: pwsh
        run: gh pr comment 5 --repo $env:GITHUB_REPOSITORY --body-file evidence-windows.md

  verify:
    runs-on: ubuntu-22.04
    permissions:
      contents: read    # Download the published assets.
      pull-requests: write # Post the evidence to the pull request.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-dev3
    steps:
      - name: Download and check the assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -l
          {
            echo "### Published asset verification for \`$TAG\`"
            echo
            echo '```'
            echo '$ sha256sum -c SHA256SUMS.txt'
            sha256sum -c SHA256SUMS.txt
            echo
            echo '$ gh release view --json assets (digests reported by GitHub)'
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | "\(.name)  \(.size) bytes  \(.digest // "no digest")"'
            echo
            echo '$ tar tzf stockbear-0.1.0-dev3-linux-x64.tar.gz'
            tar tzf stockbear-0.1.0-dev3-linux-x64.tar.gz
            echo
            echo '$ python3 -c "zipfile namelist" stockbear-0.1.0-dev3-windows-x64.zip'
            python3 -c 'import zipfile,sys; [print(n) for n in zipfile.ZipFile(sys.argv[1]).namelist()]' \
              stockbear-0.1.0-dev3-windows-x64.zip
            echo
            echo '$ tar xzf linux archive; ./stockbear uci | head -12'
            mkdir -p x && tar xzf stockbear-0.1.0-dev3-linux-x64.tar.gz -C x
            printf 'uci\nquit\n' | ./x/stockbear | head -12
            echo
            echo '$ ./stockbear bench --depth 6 | head -3'
            ./x/stockbear bench --depth 6 | head -3
            echo
            echo '$ ./stockbear bench --depth 6 | tail -1'
            ./x/stockbear bench --depth 6 | tail -1
            echo
            echo '$ ./stockbear bench --depth 7 | tail -1'
            ./x/stockbear bench --depth 7 | tail -1
            echo '```'
          } > /tmp/evidence.md 2>&1 || true
          cat /tmp/evidence.md
          gh pr comment 5 --repo "$GITHUB_REPOSITORY" --body-file /tmp/evidence.md
