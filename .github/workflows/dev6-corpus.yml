name: Dev6 exp-0048 self-play corpus

# Training-data generation for the exp-0048 candidate evaluator. This is NOT a
# strength benchmark: both sides are the immutable DEV5 champion binary, so no
# Elo can be measured here and nothing produced by this workflow is ever pooled
# with a match. See docs/DEV6_PREREG_EXP0048.md §3 (frozen before any game).
#
# Same two-stage discipline as dev6-tier1.yml:
#   mode=generate  -> 8 isolated GitHub-hosted VMs, one opening shard each;
#                     evidence is uploaded as artifacts and NOTHING is pushed.
#   mode=export    -> downloads the artifacts of one completed run, verifies
#                     every SHA-256, combines the shards, and makes ONE
#                     deliberate evidence commit on THIS branch.
#
# The push trigger exists because a workflow_dispatch workflow must be
# registered on the DEFAULT branch before it can be dispatched, and this
# mission must not modify main.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'generate | export'
        required: true
        default: 'generate'
        type: choice
        options: [generate, export]
      source_sha:
        description: 'EXACT source commit SHA, or HEAD for the triggering commit'
        required: true
        type: string
      source_run_id:
        description: 'For mode=export: run id whose artifacts are exported'
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'benchmarks/exp-runs/corpus-dispatch.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: dev6-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve dispatch / verify frozen corpus plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      experiment_id: ${{ steps.cfg.outputs.experiment_id }}
      source_sha: ${{ steps.cfg.outputs.source_sha }}
      source_run_id: ${{ steps.cfg.outputs.source_run_id }}
      shards: ${{ steps.cfg.outputs.shards }}
      games: ${{ steps.cfg.outputs.games }}
      seed: ${{ steps.cfg.outputs.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE='${{ inputs.mode }}'
            SHA='${{ inputs.source_sha }}'
            SRID='${{ inputs.source_run_id }}'
            EXP=exp0048
          else
            python3 -c 'import json;d=json.load(open("benchmarks/exp-runs/corpus-dispatch.json"));[print(k+"="+str(d.get(k,""))) for k in ("mode","experiment_id","source_sha","source_run_id")]' > /tmp/cfg.env
            cat /tmp/cfg.env
            . /tmp/cfg.env
            MODE="$mode"; SHA="$source_sha"; SRID="$source_run_id"; EXP="$experiment_id"
          fi
          [ "$EXP" = "exp0048" ] || { echo "this lane only generates the frozen exp0048 corpus" >&2; exit 1; }
          if [ -z "$SHA" ] || [ "$SHA" = "HEAD" ]; then SHA="$(git rev-parse HEAD)"; fi
          git cat-file -e "$SHA^{commit}" || { echo "unknown source_sha $SHA" >&2; exit 1; }
          # The prereg, the generator and every opening shard must already exist
          # in the pinned commit: conditions cannot be invented at run time.
          git show "$SHA:docs/DEV6_PREREG_EXP0048.md" > /tmp/prereg.md
          git show "$SHA:benchmarks/dev6-baseline/exp0048_corpus_suites.json" > /tmp/suites.json
          sha256sum /tmp/prereg.md /tmp/suites.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s = json.load(open("/tmp/suites.json"))
          assert s["count"] == 3000 and s["shards"] == 8 and s["disjoint_overlap"] == 0, s
          assert s["purpose"] == "evaluator-fitting-only", s
          shards = [{"shard": k, "sha256": v} for k, v in sorted(s["slices"].items())]
          print("shards=" + json.dumps(shards))
          print("games=" + str(2 * s["count"] // s["shards"]))
          print("seed=2026110603")
          PY
          {
            echo "mode=$MODE"
            echo "experiment_id=$EXP"
            echo "source_sha=$SHA"
            echo "source_run_id=$SRID"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$MODE experiment=$EXP source_sha=$SHA source_run_id=$SRID"

  generate:
    name: corpus-${{ matrix.job.shard }}
    if: needs.prepare.outputs.mode == 'generate'
    needs: prepare
    runs-on: ubuntu-latest        # one dedicated GitHub-hosted VM per shard
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        job: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      EXPERIMENT_ID: ${{ needs.prepare.outputs.experiment_id }}
      GAMES: ${{ needs.prepare.outputs.games }}
      SEED: ${{ needs.prepare.outputs.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python3 -m pip install --disable-pip-version-check -q 'chess==1.11.2'
      - name: Generate one preregistered corpus shard
        run: |
          set -euo pipefail
          python3 scripts/dev6_corpus_job.py \
            --shard '${{ matrix.job.shard }}' \
            --source-sha "$SOURCE_SHA" --experiment-id "$EXPERIMENT_ID" \
            --games "$GAMES" --seed "$SEED" \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}'
      - name: Upload complete shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-exp0048-${{ matrix.job.shard }}-run${{ github.run_id }}
          path: benchmarks/exp-runs/corpus-exp0048-${{ matrix.job.shard }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  export:
    name: Verify and export the combined corpus (deliberate, explicit)
    if: needs.prepare.outputs.mode == 'export'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download artifacts from the pinned run (supported interface)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify every shard checksum
        shell: bash
        run: |
          set -euo pipefail
          find downloaded -type f | sort
          fails=0
          while IFS= read -r f; do
            ( cd "$(dirname "$f")" && sha256sum -c "$(basename "$f")" ) || fails=$((fails+1))
          done < <(find downloaded -name SHA256SUMS.txt -type f)
          echo "checksum failures: $fails"
          [ "$fails" -eq 0 ] || { echo "artifact checksum mismatch" >&2; exit 1; }
      - name: Combine shards into the frozen fitting corpus
        shell: bash
        run: |
          set -euo pipefail
          dest="benchmarks/exp-runs/corpus-export/run-$SOURCE_RUN_ID"
          mkdir -p "$dest"
          python3 scripts/dev6_corpus_combine.py \
            --shards downloaded --out "$dest" --experiment-id exp0048 \
            --expect s00,s01,s02,s03,s04,s05,s06,s07 --source-run-id "$SOURCE_RUN_ID"
          # Keep the per-shard manifests too: they carry runner + termination
          # detail that the combined manifest only summarises.
          mkdir -p "$dest/shards"
          for d in downloaded/corpus-exp0048-*; do
            s="$(basename "$d")"
            cp "$d/manifest.json" "$dest/shards/$s.json"
            cp "$d/SHA256SUMS.txt" "$dest/shards/$s.SHA256SUMS.txt"
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$dest/artifacts.json"
          python3 - "$dest" <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          dest = Path(sys.argv[1])
          arts = json.loads((dest / "artifacts.json").read_text())["artifacts"]
          m = {"exported_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "source_run_id": os.environ["SOURCE_RUN_ID"],
               "export_workflow_run_id": os.environ["GITHUB_RUN_ID"],
               "experiment_id": "exp0048",
               "artifacts": [{"id": x["id"], "name": x["name"], "size_in_bytes": x["size_in_bytes"]}
                             for x in arts],
               "channel": "git + GitHub Contents API (blob CDN unreachable from sandbox)"}
          (dest / "export_manifest.json").write_text(json.dumps(m, indent=2) + "\n")
          print(json.dumps(m, indent=2))
          PY
      - name: Commit ONE deliberate evidence export
        shell: bash
        run: |
          set -euo pipefail
          dest="benchmarks/exp-runs/corpus-export/run-$SOURCE_RUN_ID"
          git config user.email "dev6-corpus@stockbear.local"
          git config user.name "dev6-corpus-exporter"
          git add -A "$dest"
          git commit -q -m "dev6-corpus[exp0048]: export fitting corpus from run $SOURCE_RUN_ID [skip ci]"
          ok=0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"${{ github.ref_name }}"; then ok=1; break; fi
            echo "export push attempt $attempt failed; retrying" >&2
            sleep 15
          done
          [ "$ok" -eq 1 ] || { echo "export push failed after 4 attempts" >&2; exit 1; }
          echo "exported to $dest at $(git rev-parse HEAD)"
