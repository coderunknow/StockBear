name: Diagnose the tournament smoke-test flake

# One-shot investigation: the reference job failed once in
# `tests/integration/test_tournament.py` on a tree that passed on every other
# run. Repeat the step on the same runner image and post each failure verbatim.

on:
  push:
    branches: [arena/7b82fbe2-stockbear]
    paths: ['.github/diagnose-tournament']

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess==1.11.2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTOCKBEAR_BUILD_TESTS=ON
      - run: cmake --build build --parallel 2
      - name: Repeat the flaky step
        shell: bash
        run: |
          set -u
          : > /tmp/diag.md
          echo '### Tournament smoke test repeated ten times on the CI runner' >> /tmp/diag.md
          echo '```' >> /tmp/diag.md
          pass=0; fail=0
          for i in $(seq 1 10); do
            start=$(date +%s%N)
            if python tests/integration/test_tournament.py ./build/stockbear > /tmp/out.$i 2>&1; then
              pass=$((pass+1))
              echo "run $i: PASS ($(( ($(date +%s%N) - start) / 1000000 )) ms)" >> /tmp/diag.md
            else
              fail=$((fail+1))
              echo "run $i: FAIL ($(( ($(date +%s%N) - start) / 1000000 )) ms)" >> /tmp/diag.md
              sed -n '1,40p' /tmp/out.$i >> /tmp/diag.md
            fi
          done
          echo "passes=$pass failures=$fail" >> /tmp/diag.md
          echo '```' >> /tmp/diag.md
          cat /tmp/diag.md
          gh pr comment 3 --repo "$GITHUB_REPOSITORY" --body-file /tmp/diag.md
        env:
          GH_TOKEN: ${{ github.token }}
